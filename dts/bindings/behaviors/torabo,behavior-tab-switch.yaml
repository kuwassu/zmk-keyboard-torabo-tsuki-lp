description: Send a Windows or Mac tab shortcut according to the active base layer
compatible: "torabo,behavior-tab-switch"
include: two_param.yaml

properties:
  mac-layer:
    type: int
    required: true
    description: Mac base layer, including when covered by momentary layers

# Inherit param1 / param2 from two_param.yaml; Zephyr forbids renaming them.
# param1: Windows shortcut, param2: Mac shortcut.
