CONFIG_IQS7211E=y
CONFIG_IQS7211E_SCROLLER_INERTIA=y

# 慣性スクロールの減衰率（0〜1000の千分率）
# 920の場合、毎回の更新で92%の速度を維持する（値が小さいほど早くブレーキがかかる）
CONFIG_IQS7211E_SCROLLER_INERTIA_DECAY_PERMILLE=915

# 慣性スクロールが完全に停止する速度の閾値
# 速度がこの値を下回るとピタッと止まる（値が大きいほど早く止まる判定になる）
CONFIG_IQS7211E_SCROLLER_INERTIA_STOP_THRESHOLD_Q8=100

# タップ操作を無効（無視）する画面端からのマージン（0〜1000の千分率）
# 80の場合、端から8%の領域に触れてもタップとして認識されない（誤操作防止）
CONFIG_IQS7211E_TAP_EDGE_MARGIN_PERMILLE=80

# HWHEEL（横スクロール）判定ゾーンの開始位置（0〜1000の千分率）
# 800の場合、全体の80%の位置から判定ゾーンが始まる
CONFIG_IQS7211E_SCROLLER_HWHEEL_ZONE_MIN_PERMILLE=0

# HWHEEL（横スクロール）判定ゾーンの終了位置（0〜1000の千分率）
# 1000の場合、全体の100%（端）までが判定ゾーンになる
CONFIG_IQS7211E_SCROLLER_HWHEEL_ZONE_MAX_PERMILLE=250
